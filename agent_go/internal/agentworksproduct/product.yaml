schema_version: 2

# AgentWorks is the platform's own generic, workflows-only product -- unlike
# Video Studio/SparkQuill/Dominion/Finance, it has no fixed single-purpose
# prompt, no bespoke tools, and no one project workspace to bind to. This
# manifest is a deliberate first, minimal step: it exists so AgentWorks has
# a real, resolvable agent profile ID in the same registry every other
# product uses, WITHOUT moving any of AgentWorks' actual tool/routing logic
# here yet (that logic is Go-code-driven today -- see
# cmd/server/workflow_ui_policy.go, workflow_view_tool.go -- and stays
# there). Nothing currently sets AgentProfileID="agentworks" anywhere in the
# codebase, so registering this profile is inert on its own: it does not
# change any existing request's behavior. It only becomes load-bearing once
# something is deliberately wired to request it (e.g. a WhatsApp pairing's
# default_profile_id, or a future explicit agent-profile route) -- that is a
# separate, later decision, not part of this step.
dependencies: {}

prompt:
  file: prompts/system-prompt.md
  variables: {}

profile:
  id: agentworks
  name: AgentWorks
  version: 1
  # Global, not project: AgentWorks has no single fixed workspace to bind
  # to -- a real AgentWorks session moves between whichever workflow the
  # user is working in, the same dynamic multi-agent behavior the platform
  # already gives a normal (no agent-profile) session. Project scope's
  # "one fixed prompt/workspace" model, which every other product.yaml
  # today uses on purpose, is the wrong shape for AgentWorks specifically.
  scope: global
  # No tools/tool_policy/skills declared yet -- deliberately. This step is
  # scaffolding only; AgentWorks' existing tool surface (workflow tools, UI
  # control tools, etc.) stays exactly as Go-registered today. Moving any of
  # that here is a separate, later decision.
  built_in: true

branding:
  icon: ""
  favicon: ""

ui:
  surface: ""
  files_panel: false
  workflow_panel: false
  secrets: false
  streaming: auto

workflows:
  enabled: []
  selected_skills: []
  browser_mode: ""
