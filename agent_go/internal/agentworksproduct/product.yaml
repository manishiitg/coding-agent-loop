    # External-native tools: scoped readers plus run operations with no chat
    # equivalent, each with a server implementation. The run-mode `tools`
    # list above is the single source of truth for the run surface and is
    # additionally exposed in full (see RunTools): names with a native
    # implementation keep it, the rest are proxied to a pinned Run-mode
    # session. A name here without an implemented external tool fails server
    # startup, as does an implemented tool missing from both lists. Admitting
    # an authoring mutation here is a deliberate API change, not a drive-by
    # edit: tokens read and run, never author.
    external_tools:
      - list_workflows
      - get_workflow
      - list_files
      - search_files
      - get_file_link
      - read_file
      - get_plan
      - get_agent_context
      - list_guidance_topics
      - get_guidance_topic
      - list_workflow_knowledge
      - read_workflow_knowledge
      - list_runs
      - get_run
      - get_logs
      - run_status
      - chat
      - run_reply_input
    prompt:
      file: prompts/run.md
      includes: [prompts/workflow-shared.md]
    skills: [system-tools, builder-reference]

