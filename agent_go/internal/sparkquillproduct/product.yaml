schema_version: 2

# SparkQuill: a parent and their child, on one account, with one guide
# ("Quill"). The parent profile is the product's conversation; the child
# profile runs inside one activity folder at a time, behind the parent's PIN,
# and never sees the rest of the workspace.
#
# This manifest is SparkQuill. The standalone family server it replaced
# (cmd/family-server, deleted September 2026) is gone; the family tools are
# product tool factories (tools.go). WhatsApp is the platform's shared
# connector with this profile as the default destination (runtime
# capability `whatsapp`), not the old dedicated bot. Not carried over:
# send_whatsapp_file and the desktop notification channel.
#
# Layout under the family root (Chats/SparkQuill): activities/<slug>/ holds
# every activity (activity.json + product.json, which makes the folder the
# child's own conversation), plus materials/, memory/, reports/, inbox/,
# archive/.
dependencies: {}

prompt:
  file: prompts/parent.md
  variables: {}

profile:
  id: sparkquill
  name: SparkQuill
  version: 1
  # project scope with a fixed root: the folder guard and the strict sandbox
  # apply to a project-scoped profile, and workspace secrets are attached;
  # global scope gets neither.
  scope: project
  skills:
    - guides
    - image-prompting
    - read-file
    - process-file
    - recall-conversations
    - teach-coding
    - discover-something-new
    - create-progress-report
    - publish
    - notify
    - backup
  tools:
    - id: sparkquill.set-child-profile
    - id: sparkquill.set-parent-label
    - id: sparkquill.pin-page
    - id: sparkquill.unpin-page
    - id: sparkquill.create-learning-activity
    - id: sparkquill.open-file
      presentation:
        kind: document.file
        activity: {label: File opened, destination: Viewer, detail: Shown on the right}
    - id: sparkquill.open-activity
      presentation:
        kind: sparkquill.activity
        activity: {label: Activity ready, destination: Viewer, detail: Ready to hand over}
    - id: platform.suggest-actions
      interaction:
        kind: suggestions
        render: chat.suggestions
    - id: sparkquill.find-image
  commands:
    - name: create-study-material
      description: "Create study material"
      prompt: "Create study material for my child on the topic she is working on \u2014 explain it properly first, then a short practice, and a summary she can reread."
    - name: create-study-material-ib
      description: "Study material (IB style)"
      prompt: "Create study material for my child on the topic she is working on, in IB style - concept-based framing with IB command terms and inquiry-led explanation, then practice and a summary she can reread."
    - name: create-study-material-cbse
      description: "Study material (CBSE style)"
      prompt: "Create study material for my child on the topic she is working on, in CBSE style - NCERT-aligned explanation, then competency and case-based practice, and a summary she can reread."
    - name: create-study-material-icse
      description: "Study material (ICSE style)"
      prompt: "Create study material for my child on the topic she is working on, in ICSE style - thorough explanation with precise definitions, application-heavy practice, and a summary she can reread."
    - name: create-a-practice-test
      description: "Create a practice test"
      prompt: "Create a practice test for my child \u2014 a short refresher, then a proper check with real tiers, plus the answer key for me."
    - name: surprise-her
      description: "Surprise her with something new"
      prompt: "Surprise her with something fun and off-syllabus - something new for her to discover this week."
    - name: update-progress-report
      description: "Update progress report"
      prompt: "Build an updated progress report \u2014 follow your create-progress-report skill, make it a designed HTML page, and give me a short coach-style read of the evidence here in chat too."
    - name: run-check-in
      description: "Run check-in now"
      prompt: "Run the check-in now: review her recent learning and school subjects from real evidence, check the school websites I'm watching (log in with my saved secrets where needed), rebuild the progress page, and tell me the headline here in chat."
    - name: check-school-websites
      description: "Check school websites"
      prompt: "Check my watched school websites now - log in with my saved secrets where needed - and tell me anything new or needing attention: homework, grades, notices, deadlines."
    - name: back-up-workspace
      description: "Back up workspace"
      prompt: "Back up my workspace now \u2014 follow your backup skill."
  tool_policy:
    mode: allowlist
    enabled:
      - execute_shell_command
      - diff_patch_workspace_file
      - read_image
      - notify_user
      - agent_browser
      - list_secrets
      - set_user_secret
      - delete_user_secret
      - set_child_profile
      - set_parent_label
      - pin_page
      - unpin_page
      - create_learning_activity
      - open_file
      - open_activity
      - suggest_actions
      - find_image
      - image_gen
      - image_edit
  runtime:
    transport: auto
    provider_options:
      - id: claude-code
        label: Claude Code
        provider: claude-code
        model_id: claude-sonnet-5
        models: [claude-sonnet-5]
        reasoning_efforts: [low, medium, high]
        options:
          reasoning_effort: high
        default: true
      - id: codex-cli
        label: Codex
        provider: codex-cli
        model_id: gpt-6-astra
        models: [gpt-6-astra, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
        reasoning_efforts: [low, medium, high]
        options:
          reasoning_effort: medium
    agent_tools:
      mode: mcp_only
    capabilities:
      live_input: preferred
      raw_terminal: disabled
      warm_session: preferred
      browser: preferred
      voice: preferred
      # The chats rail's own "New chat" button drives this (it dispatches the
      # same agentworks:product-new-conversation event); disabled so the
      # generic composer control doesn't duplicate it.
      new_conversation: disabled
      # The parent's own WhatsApp ("message yourself") reaches Quill directly:
      # pairing from SparkQuill makes this profile the account's default
      # WhatsApp destination, so no @slug prefix is ever needed. The
      # connector itself is the platform's.
      whatsapp: preferred
    workspace:
      mode: fixed
      root: Chats/SparkQuill
    conversation:
      mode: singleton
    sandbox:
      mode: strict
      network: allowed
      read_only: [Downloads]
  ui_panels:
    schedules: true
    files: true
  schedules:
    - id: pulse
      name: Check-in
      description: Quill reviews the child's progress, school subjects and watched school websites, rebuilds the holistic progress page, then notifies the parent with the headline.
      enabled: false
      # Its own conversation, session and coding-CLI process — never the
      # parent's live chat. Without this a scheduled run reused that exact
      # session, so a check-in firing while the parent was mid-chat collided
      # on the same tmux-backed process. Its turns are invisible to the
      # parent's own transcript, so notify_user is the only way anything
      # from a check-in reaches them.
      isolated: true
      cadence_hours: 24
      quiet_minutes: 10
      max_deferral_hours: 4
      messages:
        - "This is an automated check-in, in your own separate check-in history — not the parent's chat, which cannot see this. Your main job: check the child's progress and school subjects from real evidence in the workspace (activities, attempts, materials, school papers), check the watched school website(s) with agent_browser - call agent_browser(command=\"status\") first, log in with saved secrets where needed, check memory/browser-notes.md before navigating and save what you learn there - and rebuild the holistic progress page at reports/progress.html by following your create-progress-report skill — full regeneration every time, with today's date inside. Cover every subject with evidence, what she can and cannot do yet, and what to work on next. Then write ONE short, warm message as your reply (the parent is not technical; no files, paths or JSON)."
        - "This automated check-in is done and the progress page is rebuilt. Decide what is ACTUALLY worth telling the parent, lead with what matters most — what changed, the one gap to act on — and call notify_user EXACTLY ONCE with a short title and a brief plain message (1-3 sentences) pointing at the refreshed Progress tab. If truly nothing meaningful happened, still send one honest line so the parent knows the check-in ran."
  built_in: true

profiles:
  - id: sparkquill-child
    name: SparkQuill Child
    version: 1
    scope: project
    prompt:
      file: prompts/child.md
      variables: {}
    skills:
      - guides
      - image-prompting
    tools:
      - id: sparkquill.open-activity-file
        presentation:
          kind: document.file
          activity: {label: Page opened, destination: Viewer, detail: Shown on the right}
      - id: sparkquill.celebrate
        interaction:
          kind: celebrate
          render: chat.celebration
      - id: sparkquill.show-scene
        interaction:
          kind: scene
          render: chat.scene
      - id: sparkquill.find-activity-image
    commands:
      - name: score-by-answer
        description: "Score by answer"
        prompt: "Go through every question I've answered so far on this page and score me question by question: for each one, show the question, my answer, and whether it's right or wrong with the correct answer if it's wrong. Then give me a total score."
      - name: recap
        description: "Recap"
        prompt: "Can you recap how I'm doing in this activity? Tell me what I've finished so far, what I'm getting right, where I still make mistakes, and what I should work on next."
      - name: walk-me-through-my-mistakes
        description: "Walk me through my mistakes"
        prompt: "Can you walk me through the questions I got wrong, one at a time? For each one, show me the question and what I answered, help me spot my mistake with hints instead of just telling me, and only move to the next one once I've got it right. At the end, tell me the pattern in my mistakes."
      - name: check-strictly
        description: "Check strictly"
        prompt: "Check my last answer strictly, like an examiner: mark it exact, name every error precisely, and don't count a partial or close answer as correct. But I answer by voice, so ignore spelling slips from transcription and judge what I meant - unless this is a spelling test, where spelling counts."
      - name: keep-quizzing-me-harder-each-time
        description: "Adaptive quiz"
        prompt: "Quiz me adaptively like the GMAT: start at medium difficulty, one question at a time. If I get one right, make the next harder; if I get one wrong, make the next easier and quickly teach me what I missed before moving on. Tell me right or wrong with one short why each time, keep track of my level, and after about 8 questions (or when I say stop) tell me where I landed and what to practice."
      - name: give-me-a-real-example
        description: "Give me a real example"
        prompt: "Can you give me a real-world example of this, not just the definition?"
    tool_policy:
      mode: allowlist
      enabled:
        - execute_shell_command
        - diff_patch_workspace_file
        - read_image
        - notify_user
        - open_file
        - celebrate
        - show_scene
        - find_image
        - image_gen
        - image_edit
    runtime:
      transport: auto
      provider_options:
        - id: claude-code
          label: Claude Code
          provider: claude-code
          model_id: claude-sonnet-5
          models: [claude-sonnet-5]
          reasoning_efforts: [low, medium, high]
          options:
            reasoning_effort: medium
          default: true
        - id: codex-cli
          label: Codex
          provider: codex-cli
          model_id: gpt-5.6-luna
          models: [gpt-6-astra, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
          reasoning_efforts: [low, medium, high]
          options:
            reasoning_effort: high
      agent_tools:
        mode: mcp_only
      capabilities:
        live_input: preferred
        raw_terminal: disabled
        warm_session: preferred
        browser: disabled
        secrets: disabled
        voice: preferred
      workspace:
        # One conversation per activity: the activity folder is the project.
        mode: project
        projects_root: Chats/SparkQuill/activities
      conversation:
        mode: keyed
        key_type: project
      sandbox:
        # Deny-by-default: the activity folder only, no network, no secrets
        # in the environment: the child's shell boundary. The family's
        # conversation logs (the parent's chats with Quill included) stay
        # out of reach too.
        mode: strict
        network: disabled
        read_only: [Downloads]
        chat_history: none
    built_in: true

branding:
  icon: sparkles
  favicon: sparkles

ui:
  surface: sparkquill
  files_panel: true
  workflow_panel: false
  secrets: true
  streaming: structured

workflows:
  enabled: []
  selected_skills: []
  browser_mode: ""
