schema_version: 2

# Product dependencies are installed inside each project workspace. This keeps
# external capabilities declarative and versioned with the product instead of
# adding per-product backend code. The agent receives only attached skills;
# the rest stay in skills/ for progressive disclosure.
dependencies:
  skills:
    - id: hyperframes-skills
      installer: skills-cli
      source: heygen-com/hyperframes
      # Keep HyperFrames as a cinematic production technique for exact UI,
      # titles, diagrams, overlays, transitions, and compositing.
      install:
        - hyperframes
        - hyperframes-core
        - hyperframes-animation
        - hyperframes-creative
        - hyperframes-cli
        - media-use
        - hyperframes-registry
        - hyperframes-keyframes
      attach: [hyperframes]
      refresh_hours: 24

  # npx provides the renderer CLI itself. Verification both fetches the
  # package on first use and confirms the project's native tooling is ready.
  cli:
    - id: hyperframes-cli
      package:
        ecosystem: npm
        name: hyperframes
        version: latest
      execution:
        mode: npx
        binary: hyperframes
      verify:
        args: [doctor, --json]
        # HyperFrames reports optional TTS/music/Docker failures in JSON while
        # still returning status zero. Only these local-render prerequisites
        # block a Video Studio project from starting production.
        required_json_checks: [Version, Node.js, FFmpeg, FFprobe, Chrome]
      refresh_hours: 24
      permissions:
        network: true
        write_paths: [work/, outputs/, runs/]

  # Future integrations are declared here. A concrete enabled server is
  # connected by the shared agent runtime, which resolves environment values
  # from AgentWorks secrets rather than storing values in this file.
  mcp_servers: []

prompt:
  file: prompts/system-prompt.md
  variables:
    PRODUCT_NAME: Video Studio

# Declarative product composition. The IDs below reference shared AgentWorks
# skills/tools and registered product implementations; no executable code lives
# in this file.
profile:
  id: video-studio
  name: Video Studio
  version: 2
  skills:
    - video-look-sound
    - cinematic-visual-development
    - longform-cinematic-video
    - multi-clip-cinematic-generation
    - video-stitching
    - video-editing
    - video-quality
    - hyperframes-quality
    - hyperframes
    - agent-browser
    - fal-ai
    - google-ai
    - video-provider-capabilities
    - minimax-h3-video
    - video-cinematography
    - video-storytelling
    - generated-video-quality
  tools:
    - id: video.show-video
      # Declares what this tool shows, not how. The frontend renderer
      # registered for this kind (getPresentationRenderer) and the
      # tool's own factory (which reads this at construction rather
      # than hardcoding it) both key off this one value. See
      # pkg/presentations and docs/design/agent_tool_surface_single_source.md.
      presentation:
        kind: media.video
        activity:
          label: Video ready
          destination: Videos panel
          detail: Ready to review
    # A character reference is pre-production, not a deliverable: it is shown
    # so the user can reject a face while changing it is still cheap. Video
    # previews are likewise review material; show-video applies its QA gate
    # only when the caller supplies a final quality report.
    - id: video.show-character
      presentation:
        kind: media.character
        activity:
          label: Character reference ready
          destination: Characters panel
          detail: Ready for approval
    # Locations, wardrobe, props, and sequence boundary frames are their own
    # reviewable evidence. They must not be smuggled into the Characters panel.
    - id: video.show-reference
      presentation:
        kind: media.reference
        activity:
          label: Visual reference ready
          destination: References panel
          detail: Ready for approval
    # The written artifacts a stage produces — brief, script, shot list — are
    # what the user actually approves between stages.
    - id: video.show-document
      presentation:
        kind: document.markdown
        activity:
          label: Production document ready
          destination: Documents panel
          detail: Ready to review
  tool_policy:
    # Video Studio names the tools it needs. Everything AgentWorks registers that
    # is not listed here never reaches the agent.
    #
    # This is an allow list rather than the old `disabled:` deny list because a
    # deny list silently widens: every new platform tool reaches this product
    # until someone remembers to block it. Naming the surface also makes the
    # registered set and what get_api_spec advertises the same thing, which is
    # what stopped set_workflow_secret from being registered-but-invisible.
    # See docs/design/agent_tool_surface_single_source.md.
    #
    # Not listed, deliberately: AgentWorks provider/model, skill and MCP-server
    # administration; media-generation tools; sub-agent orchestration (delegate,
    # query_agent, list_agents, terminate_agent); every schedule tool; and
    # human_feedback / notify_user. Read-only image inspection and web research
    # are product capabilities, so they are explicitly admitted below.
    #
    # This list does not govern mcpagent's intrinsic tools
    # (get_api_spec, get_prompt, get_resource, read_skill), which it injects
    # itself. Video Studio is deliberately MCP-only: terminal-native Claude
    # interactions cannot be represented in the browser chat, whereas MCP tool
    # calls have structured progress and results. Product HTTP APIs therefore
    # go through the shared, guarded shell bridge. Reaching them from each
    # CLI's own shell was tried and reverted: see
    # docs/design/product_api_transport_for_coding_agents.md.
    mode: allowlist
    enabled:
      # The product's own control.
      - show_video
      # Pre-production surfaces: a character's reference image before shots are
      # generated from it, and the written artifact a stage just produced.
      - show_character
      - show_reference
      - show_document
      # MCP-only file editing is guarded and reported to the browser, unlike a
      # provider-native terminal edit.
      - diff_patch_workspace_file
      # The bridge shell is how product HTTP APIs are called. Every provider can
      # reach it (Codex only through its JS code-mode sandbox, which has no
      # network and no env of its own).
      - execute_shell_command
      # Managed browser capability, matching the agent-browser skill above.
      - agent_browser
      # Inspect uploaded references and generated boundary frames, then verify
      # current H3 schema, pricing, and factual creative research on the web.
      - read_image
      - search_web_llm
      # Project and user secret CRUD. ui.secrets is required for this product.
      - list_secrets
      - set_workflow_secret
      - delete_workflow_secret
      - set_user_secret
      - delete_user_secret
  # Slash commands this product ships with itself. The platform already has
  # builtin commands and per-user markdown under commands/custom/, but neither
  # lets a product carry its own, so Video Studio's opinionated flows had no
  # way into the command menu.
  #
  # Each prompt lives in its own file rather than inline here: they are long,
  # and they are prompts, which belong next to the system prompt rather than
  # buried in a manifest. `{{context}}` is replaced with whatever the user
  # typed before the slash.
  commands:
    - name: production
      description: Start a video production — brief, cost, and characters agreed before anything is generated
      icon: clapperboard
      file: commands/production.md
    - name: characters
      description: Design a new character, review existing ones, or revise one already in use
      icon: users
      file: commands/characters.md
    - name: plan
      description: Show the script and shot list, with what the run will cost
      icon: file-text
      file: commands/plan.md
    - name: revise
      description: Change one shot without rebuilding the video
      icon: pencil
      file: commands/revise.md
    - name: check
      description: Re-run quality checks on the current cut
      icon: check
      file: commands/check.md
  # Credentials this product's skills read from the environment. Declaring
  # these is what lets "which key is missing" be answered before a paid run
  # starts, instead of only after a generation call fails partway through a
  # production -- see fal-ai and google-ai's Authentication sections for the
  # SECRET_<NAME> mechanics these names are read through.
  secrets:
    - name: FAL_KEY
      description: fal.ai API key. Required for MiniMax H3 Reference-to-Video and optional still-image, voice, or music work. Get one at fal.ai.
      group: generation-provider
    - name: GEMINI_API_KEY
      description: Google Gemini API key. Used only for optional still-image and narration (TTS) work; generated video remains MiniMax H3 Reference-to-Video. Get one at aistudio.google.com.
      group: generation-provider
  runtime:
    # auto resolves the transport per provider instead of forcing one answer for
    # all four. It is what video_studio_inside_agentworks.md always specified
    # ("a tmux-capable runtime for live steering"); the pin to `structured` here
    # had drifted from that and was load-bearing in the wrong direction.
    #
    # Structured transport cannot stream unless the CLI emits partial events, and
    # only pi-cli does. codex exec --json was probed directly: a 1365-character
    # answer arrived as ONE item.completed event, so a codex user saw nothing at
    # all until the turn finished, and live steering is impossible on a transport
    # with no stdin. The clean non-technical surface does not depend on this
    # setting -- raw terminal frames are already excluded downstream by
    # Source != "terminal", not by refusing to run tmux.
    #
    # See product_api_transport_for_coding_agents.md, "tmux vs structured".
    transport: auto
    provider: claude-code
    model_id: claude-sonnet-5
    # Video Studio currently uses the shared server Claude login. Project-level
    # coding-agent token overrides and their UI are deliberately disabled.
    credential_scope: global
    # Keep this browser product MCP-only. Native Claude Code tools can open a
    # terminal-only chooser or approval prompt with no bridge back to the chat,
    # leaving the visible UI permanently “Working”. MCP provides structured
    # progress/results and retains FolderGuard for all workspace access. The
    # bridge shell is the provider-neutral route for product HTTP APIs, secrets,
    # managed browser work, rendering, verification, and workflow control.
    # Do not switch to native_shell; it was intentionally left off after
    # cross-provider failures. See
    # docs/design/product_api_transport_for_coding_agents.md and PLAT-134.
    agent_tools:
      mode: mcp_only
    approvals:
      mode: provider_auto
    # Where this product's artifacts belong, in its own vocabulary, keyed by the
    # tool the advice is for. Declared here rather than left to the shared
    # default, which is AgentWorks' layout — plan folders and pulse/goals.html —
    # for concepts Video Studio does not have.
    # Keep in step with prompts/system-prompt.md, which tells the agent the same
    # thing; the tool description is what it re-reads on every get_api_spec.
    workspace:
      # A chat supplies a project id, never this project's workspace path. The
      # server resolves and validates product.json below this owned root.
      mode: project
      projects_root: Chats/Video Studio/projects
      placement:
        execute_shell_command:
          - "Uploaded references live in `uploads/` and are read-only — never modify them."
          - "Direct-chat work belongs in `work/`; finished exports belong in `outputs/`."
          - "Workflow steps write inside their own run folder, not at the project root."
        diff_patch_workspace_file:
          - "Patch files in `work/` (direct chat) or the step's own run folder (workflow). `uploads/` is read-only — copy a reference into `work/` before changing it."
    conversation:
      # Each Video Studio project owns one durable conversation. The project
      # may move or the live CLI may be reaped without changing that identity.
      mode: keyed
      key_type: project
    capabilities:
      # Use the shared live-input path when the resolved provider supports it.
      # Structured providers retain the shared queued-message fallback.
      live_input: preferred
      raw_terminal: disabled
      warm_session: preferred
      workflow_execution: required
      browser: required
      secrets: required
      # Streaming microphone dictation. This product-level capability gates
      # the mic control in the shared composer. preferred, not required: the
      # composer works fine by typing, and a user without a mic or on a
      # machine where the STT model has not finished downloading should not
      # be blocked.
      #
      # The engine only exists in a CGO build (pkg/voicestt/engine_nocgo.go is
      # the stub); the EC2 release builds the agent with cgo through
      # deploy/aws-ec2/build/Dockerfile.linux-amd64-cgo for exactly this
      # reason. A CGO_ENABLED=0 build answers the mic with 503. The speech
      # model (~690MB, English, with a punctuation post-pass) is a one-time
      # download the composer offers on first use.
      voice: preferred
  # schedules: a product may declare recurring jobs here (id, name,
  # cron_expression, timezone, enabled, messages[]); the platform runs them
  # for every user with the product, one message at a time, in the product
  # conversation. Requires runtime.conversation.mode: singleton, which this
  # per-project product is not -- see docs/workflow/workflow_scheduling.md.
  built_in: true

branding:
  icon: video-studio
  favicon: /video-studio-favicon.svg

ui:
  surface: video-studio
  files_panel: true
  workflow_panel: true
  secrets: true
  streaming: structured

workflows:
  enabled: [shortform, longform, quality]
  selected_skills:
    - video-look-sound
    - cinematic-visual-development
    - multi-clip-cinematic-generation
    - video-stitching
    - video-editing
    - video-quality
    - hyperframes-quality
    - hyperframes
    - agent-browser
    - fal-ai
    - google-ai
    - video-provider-capabilities
    - minimax-h3-video
    - video-cinematography
    - video-storytelling
    - generated-video-quality
  browser_mode: auto
